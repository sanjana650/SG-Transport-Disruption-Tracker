server:
  port: 8080

spring:
  application:
    name: sg-transport-disruption-tracker
  datasource:
    url: jdbc:h2:mem:tracker;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

lta:
  # Default: call the real LTA DataMall API (needs LTA_ACCOUNT_KEY).
  # Set LTA_MOCK_ENABLED=true to use built-in sample data instead (offline demos, no key).
  mock-enabled: ${LTA_MOCK_ENABLED:false}
  base-url: https://datamall2.mytransport.sg/ltaodataservice
  account-key: ${LTA_ACCOUNT_KEY:}
  poll-interval-ms: 60000

services:
  backend:
    build: ./backend
    environment:
      # Real LTA DataMall data by default. Put LTA_ACCOUNT_KEY in a .env file (see .env.example).
      # Set LTA_MOCK_ENABLED=true to use sample data instead.
      LTA_MOCK_ENABLED: ${LTA_MOCK_ENABLED:-false}
      LTA_ACCOUNT_KEY: ${LTA_ACCOUNT_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
